# Workflow que gera a animação "cobrinha" a partir do gráfico de contribuições.
# Onde salvar no repositório: .github/workflows/snake.yml
# Resultado: o arquivo github-snake-dark.svg é publicado na branch "output".
name: Gerar animação da cobrinha

on:
  schedule:
    - cron: "0 0 * * *"      # todos os dias, à meia-noite (UTC)
  workflow_dispatch:         # permite executar manualmente pela aba Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar a animação a partir das contribuições
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=#00CFFF&color_dots=#0d1b33,#0b3d91,#1677FF,#3d9bff,#00CFFF

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
